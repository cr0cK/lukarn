#cloud-config
# Bootstraps a Debian 12+ / Ubuntu LTS VPS for the gallery.
#
# This file is cloud-init: it is passed as "user data" when creating the machine,
# at any host that accepts it — virtually all of them do, under that name or as
# "cloud-config". It is a de facto standard rather than a published norm: Fedora
# CoreOS and Flatcar use Ignition, Windows uses cloudbase-init, and a minimal
# image may not ship the package. For those cases, deploy/README.md describes the
# same setup by hand.
#
# By the end of this file the machine has: a `deploy` account with key-only sudo,
# automatic security updates, Docker, Tailscale installed but **not
# authenticated**, and a firewall allowing 22, 80 and 443 through.
#
# ---------------------------------------------------------------------------
# THE ORDER MATTERS, AND IT IS THE WHOLE POINT OF THIS FILE.
#
# The target is a machine whose port 22 is closed on the public interface,
# reachable only over Tailscale. Closing SSH **here** would make it
# unreachable: Tailscale is installed, not authenticated — there is no second way
# in yet. Port 22 therefore stays open through the bootstrap, and is closed by
# hand once the other door has been verified:
#
#   1. ssh deploy@<public-ip>
#   2. sudo tailscale up            (opens a URL to approve in a browser)
#   3. in a SECOND terminal: ssh deploy@<tailnet-name>   ← must work
#   4. only then, in the first one:
#        sudo ufw delete allow OpenSSH
#        sudo sed -i 's/^PermitRootLogin .*/PermitRootLogin no/' \
#          /etc/ssh/sshd_config.d/99-hardening.conf
#        sudo systemctl reload ssh
#
# Same precaution as § 0 of deploy/README.md: never close the door you came in
# through before having gone through the other one, from a separate terminal. If
# the machine becomes unreachable regardless, the safety net is the **host's
# rescue console** — serial, KVM or VNC depending on the provider — which does not
# go through the instance's network. Check that it exists before closing anything.
#
# Tailscale needs no inbound opening: it goes out over UDP 41641 and falls back to
# a DERP relay when NAT prevents that. The `allow outgoing` rule below is enough.
# ---------------------------------------------------------------------------

# `default` keeps the account the image provides and the keys the host injects
# into it at creation time. Without it, declaring `users:` replaces them outright
# — and if the key below was copied wrong, nobody gets in at all.
users:
  - default
  - name: deploy
    shell: /bin/bash
    groups: [sudo]
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    lock_passwd: true
    ssh_authorized_keys:
      # REPLACE THIS LINE with the contents of your `~/.ssh/id_ed25519.pub`.
      # Left as it stands it is unusable: the `deploy` account would accept no
      # connection whatsoever.
      - 'ssh-ed25519 AAAA_REPLACE_WITH_PUBLIC_KEY cloud-init@example'

# Root by key stays possible through the bootstrap: it is the second way in for as
# long as Tailscale is unauthenticated. Step 4 above closes it.
disable_root: false

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - ufw
  - unattended-upgrades
  # `backup.sh` uses it for the off-machine copy; the remote is configured
  # afterwards with `rclone config`, never in the repository.
  - rclone

write_files:
  # Equivalent to the `dpkg-reconfigure -plow unattended-upgrades` of
  # deploy/README.md, which is interactive and has no place here.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # A separate file rather than an edit to `sshd_config`: an update to the
  # openssh-server package will not offer to merge a file it knows nothing about.
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      # `prohibit-password` and not `no`: see the box at the top of this file.
      PermitRootLogin prohibit-password

runcmd:
  - ['systemctl', 'restart', 'ssh']

  - 'curl -fsSL https://get.docker.com | sh'
  # Equivalent to granting root on the machine — `deploy` already has it through
  # sudo.
  - ['usermod', '-aG', 'docker', 'deploy']

  # Installed, not authenticated: `sudo tailscale up` is a human action, it
  # requires approving a URL in a browser.
  - 'curl -fsSL https://tailscale.com/install.sh | sh'

  # The application publishes no port on the host: only Caddy is reachable.
  # 443/udp serves HTTP/3 — omitting it breaks nothing, browsers fall back to TCP.
  - ['ufw', 'default', 'deny', 'incoming']
  - ['ufw', 'default', 'allow', 'outgoing']
  - ['ufw', 'allow', 'OpenSSH']
  - ['ufw', 'allow', '80/tcp']
  - ['ufw', 'allow', '443/tcp']
  - ['ufw', 'allow', '443/udp']
  - ['ufw', '--force', 'enable']

final_message: |
  Machine ready after $UPTIME s.
  Next: ssh deploy@<ip>, then `sudo tailscale up`, then check
  `ssh deploy@<tailnet-name>` in a second terminal BEFORE closing port 22
  (`sudo ufw delete allow OpenSSH`). See the header of deploy/cloud-init.yaml.

<!doctype html>
<!-- The palette below is a slot, like the names further down: `shell.ts` replaces
     the whole `style` attribute with the colours derived from the instance's
     primary colour. Inline, because a custom property set on the element beats any
     stylesheet rule for it whatever order Vite emits its `<link>` in, and because
     it is read before the first paint — nobody sees the built-in red flash into
     the configured colour. The values written here match the `@theme` defaults in
     `styles.css`, so `pnpm dev`, where Vite serves this file untouched, looks
     exactly like production. -->
<!-- `theme-dark` is a starting position, not the answer: `public/theme.js`, loaded
     at the end of this head, swaps it for `theme-light` before the first paint if
     that is what this browser was told or what its device prefers. Written here so
     the dark ramp is bound from the very first byte — a class arriving with the
     stylesheet would leave one frame with no ramp at all. -->
<html
  lang="en"
  class="theme-dark"
  style="
    --color-accent: #eb2020;
    --color-accent-dim: #a91717;
    --color-accent-soft: #eb202029;
    --color-accent-ink: #ffffff;
  "
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- No `color-scheme` meta: `styles.css` sets the property on each ramp, and
         the property wins over the meta — two answers where one of them cannot
         follow the reader's choice. `theme-color` has no such equivalent, so it
         starts on the dark page colour and `theme.js` rewrites it. -->
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Both icons come from the API rather than `public/`: an instance may have
         uploaded its own logo, and the built-in mark carries the configured
         primary colour in its dot. One route generates whichever is in force. -->
    <link rel="icon" href="/api/branding/logo" />
    <!-- iOS ignores the manifest for the home screen icon: it needs this link, and
         it needs a PNG — it does not render SVG here. -->
    <link rel="apple-touch-icon" href="/api/branding/icon-apple-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The name below, like the one in `<title>`, is a default rather than a
         hardcoded value: the server substitutes APP_NAME at startup
         (`shell.ts`). Written as it stands, it stays correct in development,
         where Vite serves this file without going through the server. -->
    <meta name="application-name" content="Photos" />
    <meta name="apple-mobile-web-app-title" content="Photos" />
    <!-- `black`, and definitely not `black-translucent`: the latter pushes
         content under the clock, and the viewer's header — laid out `absolute`
         at the top of the screen — would end up there. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <title>Photos</title>

    <!-- Last in the head, blocking on purpose, and after the `theme-color` meta it
         rewrites. Neither `defer` nor `type="module"` — both would let the page
         paint dark first and flash. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

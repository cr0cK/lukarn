<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <!-- iOS ignores the manifest for the home screen icon: it needs this link. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The name below, like the one in `<title>`, is a default rather than a
         hardcoded value: the server substitutes APP_NAME at startup
         (`shell.ts`). Written as it stands, it stays correct in development,
         where Vite serves this file without going through the server. -->
    <meta name="application-name" content="Photos" />
    <meta name="apple-mobile-web-app-title" content="Photos" />
    <!-- `black`, and definitely not `black-translucent`: the latter pushes
         content under the clock, and the viewer's header — laid out `absolute`
         at the top of the screen — would end up there. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <title>Photos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

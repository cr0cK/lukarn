<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Photos">
  <!-- ink-900 background, accent and accent-dim tiles: the interface's colours,
       and the pattern the application actually renders on screen, a justified
       grid of unevenly wide photos.

       Two flat fills rather than opacities: an opacity composes with whatever is
       behind it, and Android lays the maskable icon on its own background.
       16-unit gutters, i.e. 1.75px on a 56px launcher icon: below that they
       close up and the six tiles become a blob.
       (XML forbids a double hyphen inside a comment, hence the hyphen-free names.) -->
  <rect width="512" height="512" rx="112" fill="#0b0b0d" />
  <g>
    <rect x="106" y="128" width="118" height="120" rx="18" fill="#7aa2ff" />
    <rect x="240" y="128" width="56" height="120" rx="18" fill="#4c6fd0" />
    <rect x="312" y="128" width="94" height="120" rx="18" fill="#7aa2ff" />
    <rect x="106" y="264" width="84" height="120" rx="18" fill="#4c6fd0" />
    <rect x="206" y="264" width="110" height="120" rx="18" fill="#7aa2ff" />
    <rect x="332" y="264" width="74" height="120" rx="18" fill="#4c6fd0" />
  </g>
</svg>

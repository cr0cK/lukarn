# An Apache `mod_dav` collection, behind Basic authentication.
#
# Written out rather than taken from a ready-made WebDAV image because the
# ready-made ones are unmaintained: the popular one still ships Apache 2.4.37,
# released in 2018. This is the current official `httpd`, and the twenty lines
# below are also the shortest statement of what the backend actually needs —
# a `Dav On` collection, a password file, and nothing else.
#
# Apache is here for its **href form**: `mod_dav` answers a `PROPFIND` with
# root-relative hrefs that percent-encode a name, which is one of the two shapes
# `storage/webdav.ts` has to read back into a path. rclone answers the other.

ServerName localhost
Listen 80
User www-data
Group www-data

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so

TypesConfig conf/mime.types
DavLockDB /tmp/DavLock

DocumentRoot /var/dav

# `/tmp/htpasswd` is written by the container's own command at startup, so that
# no password hash is committed to this repository — the reason
# `fixtures/prepare.ts` hashes the administrator's password at run time rather
# than carrying one.

<Directory /var/dav>
  Dav On
  Options None
  AuthType Basic
  AuthName "lukarn"
  AuthUserFile /tmp/htpasswd
  Require valid-user
</Directory>

ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 common

services:
  app:
    build: .
    image: googledrive-viewer
    restart: unless-stopped
    # N'expose le port que sur la boucle locale : le TLS et l'accès public sont
    # du ressort du reverse-proxy (Caddy, nginx, Traefik) installé sur le VPS.
    # Retirer `127.0.0.1:` pour joindre l'app directement, sans HTTPS.
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?définis PUBLIC_URL dans .env}
      SESSION_SECRET: ${SESSION_SECRET:?génère-le avec openssl rand -hex 32}
      TOKEN_KEY: ${TOKEN_KEY:?génère-le avec openssl rand -hex 32}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Configuration en lecture seule : l'application ne la modifie jamais.
      - ./config:/app/config:ro
      # Index SQLite et refresh token chiffré — la seule donnée irremplaçable.
      - gdv-data:/app/data
      # Vignettes générées : perdre ce volume ne coûte qu'une regénération.
      - gdv-cache:/app/cache
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  gdv-data:
  gdv-cache:

# Without this, compose derives the project name from the directory the file sits
# in, so containers are named after whatever the clone was called — an instance
# cloned before the rename still answers to `googledrive-viewer-app-1`. The
# volumes escape it because they carry their own `name:` (D53); the containers
# had nothing equivalent (D260813e).
name: lukarn

services:
  app:
    # Published on every `v*` tag: updating compiles nothing on the machine, which
    # relieves the VPS of the 4 GB that compiling sharp, argon2 and better-sqlite3
    # needed in order not to be killed by the OOM killer.
    #
    # `latest` by default, a pinned version if an update should be a decision
    # rather than a surprise: LUKARN_VERSION=1.0.0 in the `.env`.
    #
    # To build from source — an architecture other than amd64, or a local change
    # to try — the overlay is one file:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/cr0ck/lukarn:${LUKARN_VERSION:-latest}
    restart: unless-stopped
    # No port published on the host: only Caddy reaches the application, over the
    # compose-internal network. Nothing listens on a public interface apart from
    # the front end, so there is nothing to filter firewall-side for this app.
    expose:
      - '8080'
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      # The next two use `-` and not `:-`, and the whole point is in that nuance:
      # `:-` would substitute the default for an **empty** value, and empty means
      # something here. For `GEOCODING_URL` it means "call no geocoding service";
      # for `APP_NAME` it is a mistake the zod schema must be able to reject
      # rather than have it papered over.
      APP_NAME: ${APP_NAME-Photos}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE-en}
      SESSION_SECRET: ${SESSION_SECRET:?generate it with openssl rand -hex 32}
      TOKEN_KEY: ${TOKEN_KEY:?generate it with openssl rand -hex 32}
      # A path **inside the container**: the key is read under /app/config, mounted
      # from ./config. When set, it takes precedence over GOOGLE_CLIENT_*.
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # The one directory a local-folder storage may read, as a path **inside the
      # container** — it names the mount point of the volume below, not a path on
      # the host. Empty ⇒ the kind is not offered at all: /admin cannot connect a
      # folder the container was never given. Whoever runs the container plants
      # this fence; /admin only chooses a subfolder under it (D260816d).
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-}
      # Without these two, comments stay unavailable: the address verification
      # code has no way out.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Optional, and without effect on the two above: where to reply when the
      # sending address receives no mail.
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # Empty ⇒ no coordinate leaves the machine, and days keep their clusters
      # without a label. This is the application's only privacy setting: it has to
      # reach the container in order to exist.
      GEOCODING_URL: ${GEOCODING_URL-https://nominatim.openstreetmap.org}
      # Same `-` as the two above, and the same reason: empty means "ask nobody
      # whether a newer version exists", and the instance then contacts nothing at
      # all. `APP_VERSION` is deliberately absent — the image carries the version
      # it was built from, and an instance must not be able to claim another one.
      UPDATE_CHECK_URL: ${UPDATE_CHECK_URL-https://api.github.com/repos/cr0cK/lukarn/releases/latest}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      default:
        # The name the `Caddyfile` proxies to, here and behind a front end shared
        # with other applications alike — which is why it is an alias rather than
        # the service name. Compose gives every container its service name as an
        # alias too, and on a shared network `app` answers from whichever
        # application got there first; `lukarn` is this one (D260817d).
        aliases:
          - lukarn
    volumes:
      # Configuration, read-only: the application never modifies it.
      - ./config:/app/config:ro
      # Photographs already on this machine, for a local-folder storage. Uncomment
      # it together with STORAGE_LOCAL_ROOT=/photos above, and keep the `:ro` — the
      # application never writes to a storage, and the mount is what guarantees it.
      # - ./photos:/photos:ro
      # SQLite index and encrypted refresh token — the only irreplaceable data.
      - lukarn-data:/app/data
      # Generated thumbnails: losing this volume costs a regeneration, nothing
      # more.
      - lukarn-cache:/app/cache
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # TLS and public front end. See `Caddyfile`. If a proxy already runs on the
  # host, drop this service and give `app` back a `ports: ['127.0.0.1:8080:8080']`
  # — or, when that proxy runs in docker and can import the `Caddyfile` from this
  # clone, put `app` on its network instead: the upstream above is an alias
  # precisely so that arrangement resolves to this application (D260817d).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80' # HTTPS redirect and ACME challenge
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account key. **Keep these**: losing them forces a
      # reissue on every redeploy, and Let's Encrypt caps certificates per domain
      # per week.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

# Without `name:`, compose prefixes every volume with the project name — that of
# the directory it was cloned into. The `lukarn-data` volume is then really called
# `lukarn_lukarn-data`, and a `docker run -v lukarn-data:/data` creates a brand-new
# empty one instead of mounting the right one: a backup written that way is empty,
# without a single message. The explicit name keeps the README's commands correct
# whatever the directory (D53).
volumes:
  lukarn-data:
    name: lukarn-data
  lukarn-cache:
    name: lukarn-cache
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config

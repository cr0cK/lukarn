services:
  app:
    build: .
    image: nonni
    restart: unless-stopped
    # Aucun port publié sur l'hôte : seul Caddy joint l'application, par le
    # réseau interne du compose. Rien n'écoute sur une interface publique en
    # dehors du frontal, donc rien à filtrer côté pare-feu pour cette app.
    expose:
      - '8080'
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?définis PUBLIC_URL dans .env}
      # Les deux suivantes emploient `-` et non `:-`, et la nuance porte tout
      # leur sens : `:-` substituerait le défaut à une valeur **vide**, or vide
      # veut dire quelque chose ici. Pour `GEOCODING_URL`, c'est « n'appelle
      # aucun service de géocodage » ; pour `APP_NAME`, c'est une erreur que le
      # schéma zod doit pouvoir refuser au lieu qu'on la masque.
      APP_NAME: ${APP_NAME-Photos}
      SESSION_SECRET: ${SESSION_SECRET:?génère-le avec openssl rand -hex 32}
      TOKEN_KEY: ${TOKEN_KEY:?génère-le avec openssl rand -hex 32}
      # Chemin **dans le conteneur** : la clé est lue sous /app/config, monté
      # depuis ./config. Renseignée, elle prend le pas sur GOOGLE_CLIENT_*.
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Sans ces deux-là, les commentaires restent indisponibles : le code de
      # vérification d'adresse ne peut pas partir.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Facultative, et sans effet sur les deux précédentes : où répondre quand
      # l'adresse d'envoi ne reçoit pas de courrier.
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # Vide ⇒ aucune coordonnée ne sort de la machine, et les journées gardent
      # leurs grappes sans libellé. C'est le seul réglage de confidentialité de
      # l'application : il doit atteindre le conteneur pour exister.
      GEOCODING_URL: ${GEOCODING_URL-https://nominatim.openstreetmap.org}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Configuration en lecture seule : l'application ne la modifie jamais.
      - ./config:/app/config:ro
      # Index SQLite et refresh token chiffré — la seule donnée irremplaçable.
      - nonni-data:/app/data
      # Vignettes générées : perdre ce volume ne coûte qu'une regénération.
      - nonni-cache:/app/cache
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # TLS et frontal public. Voir `Caddyfile`. Si un proxy tourne déjà sur l'hôte,
  # supprimer ce service et rendre à `app` un `ports: ['127.0.0.1:8080:8080']`.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80' # redirection vers HTTPS et défi ACME
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificats et clé de compte ACME. **À conserver** : les perdre force
      # une réémission à chaque redéploiement, et Let's Encrypt plafonne le
      # nombre de certificats par domaine et par semaine.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?définis PUBLIC_URL dans .env}
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

# Sans `name:`, compose préfixe chaque volume du nom du projet — celui du
# répertoire dans lequel on a cloné. Le volume `nonni-data` s'appelle alors
# `nonni_nonni-data`, et un `docker run -v nonni-data:/data` en crée un
# neuf et vide au lieu de monter le bon : une sauvegarde ainsi écrite est vide,
# sans le moindre message. Le nom explicite rend les commandes du README justes
# quel que soit le répertoire (D53).
volumes:
  nonni-data:
    name: nonni-data
  nonni-cache:
    name: nonni-cache
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config

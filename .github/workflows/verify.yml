# Runs on every push to main and every pull request.
#
# Documentation is part of the gate, on the same footing as types and tests:
# `check:specs` compares what the code exposes — routes, environment variables,
# migrations, modules — against what the specs describe. A rule you have to
# remember to apply is a rule that eventually gets forgotten; this one fails.
name: verify

on:
  push:
    branches: [main]
  pull_request:

# A force-push to a pull request makes the run already in flight pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      # One version failing should not hide the state of the other.
      fail-fast: false
      matrix:
        # 22 is what package.json asks of a contributor, 24 is what the
        # Dockerfile ships. Testing one leaves the other free to break, and the
        # breakage then surfaces on someone else's machine, or in production.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7
        with:
          # `check:changelog` compares this branch against its merge base with
          # the target, and a shallow clone carries no merge base at all.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Native modules (sharp, better-sqlite3, argon2) need their install
      # scripts; `allowBuilds` in pnpm-workspace.yaml already permits them by
      # name.
      - run: pnpm install --frozen-lockfile

      # `shared` has to be compiled before the other two typecheck: they import
      # its declarations from `dist`.
      - run: pnpm --filter @lukarn/shared build

      - run: pnpm verify

  # The image is what production runs, and nothing built it before a tag was
  # pushed: a broken Dockerfile passed every check and only showed itself at
  # deploy time, on the machine, with the site down.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Nothing is published here — this job proves the build, and
          # release.yml does the pushing.
          push: false
          load: true
          tags: lukarn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building and starting are two different claims. A missing runtime
      # dependency, a wrong CMD, a path that exists only in the builder stage:
      # each produces an image that builds and then dies on boot. So the
      # container is actually run, with the two secrets it refuses to start
      # without and no Drive credentials — a configuration it supports.
      - name: Start the container and wait for /api/health
        run: |
          docker run -d --name lukarn-ci -p 8080:8080 \
            -e SESSION_SECRET=$(openssl rand -hex 32) \
            -e TOKEN_KEY=$(openssl rand -hex 32) \
            -e PUBLIC_URL=http://localhost:8080 \
            lukarn:ci

          # The image carries its own HEALTHCHECK, so its verdict is read rather
          # than a second one written here: a divergence between the two would
          # mean CI passing on a container Docker considers sick.
          #
          # 120s, and the margin is deliberate. The check runs every 30s, so a
          # first attempt missed on a loaded runner pushes the verdict to ~60s —
          # a tighter ceiling would fail on machine load rather than on the
          # image. Locally it reports healthy in about 7s.
          for i in $(seq 1 120); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' lukarn-ci 2>/dev/null || echo none)
            case $etat in
              healthy) echo "healthy after ${i}s"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 1
          done

          echo "::error::the container never reported itself healthy"
          exit 1

      - name: Container logs
        if: failure()
        run: docker logs lukarn-ci 2>&1 | tail -40

# Runs on every push to main and every pull request.
#
# Documentation is part of the gate, on the same footing as types and tests:
# `check:specs` compares what the code exposes — routes, environment variables,
# migrations, modules — against what the specs describe. A rule you have to
# remember to apply is a rule that eventually gets forgotten; this one fails.
name: verify

on:
  push:
    branches: [main]
  pull_request:

# A force-push to a pull request makes the run already in flight pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      # One version failing should not hide the state of the other.
      fail-fast: false
      matrix:
        # 22 is what package.json asks of a contributor, 24 is what the
        # Dockerfile ships. Testing one leaves the other free to break, and the
        # breakage then surfaces on someone else's machine, or in production.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7
        with:
          # `check:changelog` compares this branch against its merge base with
          # the target, and a shallow clone carries no merge base at all.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Native modules (sharp, better-sqlite3, argon2) need their install
      # scripts; `allowBuilds` in pnpm-workspace.yaml already permits them by
      # name.
      - run: pnpm install --frozen-lockfile

      # Nothing between the install and the gate, deliberately: `verify` compiles
      # `shared` itself (D260817). A step here would be a second copy of that
      # invariant, and the copy CI holds is the one a developer never sees.
      - run: pnpm verify

  # Everything above compiles the front end and never loads it. The whole of
  # 1.1.0 was in that gap — a tab bar, sheets, a bare viewer, a pinch — and the
  # only claim CI made about any of it was that Vite had no complaints.
  #
  # A job of its own, and deliberately **not** part of `pnpm verify`: that
  # command runs on the 22/24 matrix and on `pre-push`, and making either
  # download two browsers turns a fast local gate into a slow one, which is how
  # gates come to be bypassed.
  e2e:
    runs-on: ubuntu-latest

    # `storage.spec.ts` runs its table against every storage it can reach, and here
    # that has to be all four: the fixture starts the other three from
    # `packages/e2e/storages/compose.yml`. Without this, a runner whose daemon was
    # unavailable would quietly run the folder row alone and still report a pass —
    # and "skipped" and "passed" must not look alike on the one machine nobody
    # watches (D260816k).
    env:
      LUKARN_REQUIRE_STORAGES: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The version the Dockerfile ships: the suite runs the built server,
          # so it should run it the way production does.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suite exercises `dist/`, not a dev server: `packages/server/dist`
      # serving `packages/web/dist` is the artefact the image carries.
      - run: pnpm build

      # WebKit is the engine the mobile rework targets — safe-area insets, pinch
      # and view transitions are iOS claims, and Chromium agreeing proves
      # nothing about them. Chromium covers the desktop half.
      - run: pnpm --filter @lukarn/e2e exec playwright install --with-deps chromium webkit

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7

  # The storage backends, against the servers people actually run.
  #
  # `pnpm test` answers every S3 and WebDAV request from a local stub, which is
  # fast, needs no daemon and is the right default — but a stub agrees with
  # whoever wrote it. The shapes a real MinIO returns, the href a real Apache
  # writes and the refusal a real bucket sends were checked by nothing until this
  # job existed, and the two backends shipped that way (D260816k).
  #
  # A job of its own, and not part of `pnpm verify`, for the reason the browsers
  # are not: `verify` runs on the 22/24 matrix and on `pre-push`, and a gate
  # needing a Docker daemon is a gate people work around (D260814g).
  storages:
    runs-on: ubuntu-latest

    # A missing daemon fails here rather than skipping. Locally the suite skips,
    # so that a contributor without Docker can still run everything else.
    env:
      LUKARN_REQUIRE_STORAGES: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suite imports the server's sources, which import `@lukarn/shared`
      # through its `dist/`. Nothing else here has to be built: no browser, no
      # front end, and no server process.
      - run: pnpm --filter @lukarn/shared build

      # Starts `packages/e2e/storages/compose.yml`, seeds the three servers, runs
      # the contract table against each, and takes them down again.
      - run: pnpm test:storages

      - name: What the storages logged
        if: failure()
        run: docker compose -f packages/e2e/storages/compose.yml logs --tail 50

  # The image is what production runs, and nothing built it before a tag was
  # pushed: a broken Dockerfile passed every check and only showed itself at
  # deploy time, on the machine, with the site down.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Nothing is published here — this job proves the build, and
          # release.yml does the pushing.
          push: false
          load: true
          tags: lukarn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building and starting are two different claims. A missing runtime
      # dependency, a wrong CMD, a path that exists only in the builder stage:
      # each produces an image that builds and then dies on boot. So the
      # container is actually run, with the two secrets it refuses to start
      # without and no Drive credentials — a configuration it supports.
      - name: Start the container and wait for /api/health
        run: |
          docker run -d --name lukarn-ci -p 8080:8080 \
            -e SESSION_SECRET=$(openssl rand -hex 32) \
            -e TOKEN_KEY=$(openssl rand -hex 32) \
            -e PUBLIC_URL=http://localhost:8080 \
            lukarn:ci

          # The image carries its own HEALTHCHECK, so its verdict is read rather
          # than a second one written here: a divergence between the two would
          # mean CI passing on a container Docker considers sick.
          #
          # 120s, and the margin is deliberate. The check runs every 30s, so a
          # first attempt missed on a loaded runner pushes the verdict to ~60s —
          # a tighter ceiling would fail on machine load rather than on the
          # image. Locally it reports healthy in about 7s.
          for i in $(seq 1 120); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' lukarn-ci 2>/dev/null || echo none)
            case $etat in
              healthy) echo "healthy after ${i}s"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 1
          done

          echo "::error::the container never reported itself healthy"
          exit 1

      - name: Container logs
        if: failure()
        run: docker logs lukarn-ci 2>&1 | tail -40

# Rereads a whole specification document against the code, after a merge changed
# the code it describes.
#
# `check:specs` proves a mention exists and `check:changelog` proves a visible
# change was announced. Neither reads a paragraph and asks whether it is still
# true, and that is the defect this repository actually has: nine claims were
# found false in August 2026, some of them for six months, and **every pull
# request responsible had updated the specs**. The failure is never a missing
# edit — it is an edit made in the wrong paragraph while the contradicted one
# stays.
#
# The job is triggered by a merge rather than by a clock. Work here arrives in
# bursts, so a weekly run fires when nothing has happened and stays quiet for the
# five days after five merges. A merge also carries what a calendar cannot: which
# subsystem moved, and therefore which document to open (D260822b).
#
# It reads the document **whole**, never the diff. The claim "There is only one
# encrypted refresh token in a single-row table" survived three pull requests that
# each moved one piece of it and none of which contradicted it outright. Only
# reading the page finds those.
name: spec sync

on:
  push:
    branches: [main]
    # A merge touching only documentation has nothing to invalidate. Everything
    # here is something a specification makes a claim about.
    paths:
      - 'packages/**'
      - 'tools/**'
      - 'config/**'
      - 'deploy/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'Caddyfile'
      - 'justfile'
  workflow_dispatch:
    inputs:
      documents:
        description: 'Specs to audit, comma separated. Blank derives them from the last merge.'
        required: false

# A burst of merges is one audit, not five: the later run reads the tree the
# earlier ones were heading towards anyway.
concurrency:
  group: spec-sync
  cancel-in-progress: true

jobs:
  audit:
    # Its own corrections land on `main` like anything else, and would otherwise
    # trigger it again.
    if: "!startsWith(github.event.head_commit.message, 'docs(specs): what the code now says')"

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The audit compares a document against the history that produced it,
          # and reads the range this push carries.
          fetch-depth: 0

      # One open pull request at a time. Without this, a document left unreviewed
      # for three merges produces three pull requests saying the same thing, and
      # the third is what teaches everyone to ignore the first.
      - name: Stand down while a sync pull request is open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ouvertes=$(gh pr list --label spec-sync --state open --json number --jq 'length')
          echo "open=$ouvertes" >> "$GITHUB_OUTPUT"
          if [ "$ouvertes" != "0" ]; then
            echo "::notice::a spec-sync pull request is already open; standing down"
          fi

      # The range this push carries, or the last commit when there is none —
      # `workflow_dispatch` has no `before`, and the first push to a branch reports
      # it as forty zeroes. Resolved here rather than in the prompt: an unusable
      # range would otherwise reach the audit as an empty diff, which reads exactly
      # like "nothing changed".
      - name: What this push carries
        id: range
        env:
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.event.after }}
        run: |
          if git rev-parse --verify --quiet "$AVANT^{commit}" >/dev/null &&
             git rev-parse --verify --quiet "$APRES^{commit}" >/dev/null; then
            echo "spec=$AVANT..$APRES" >> "$GITHUB_OUTPUT"
          else
            echo "spec=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.open == '0'
        uses: pnpm/action-setup@v6

      - if: steps.guard.outputs.open == '0'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - if: steps.guard.outputs.open == '0'
        run: pnpm install --frozen-lockfile

      # The label has to exist before `gh pr create` can attach it, and the guard
      # above is the reason it matters: without the label there is nothing to
      # count, and the job stops standing down.
      - if: steps.guard.outputs.open == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create spec-sync \
            --description 'Opened by the audit that rereads a spec against the code' \
            --color BFD4F2 --force

      - if: steps.guard.outputs.open == '0'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_RANGE: ${{ steps.range.outputs.spec }}
          REQUESTED: ${{ inputs.documents }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash,Read,Edit,Write,Grep,Glob"'
          prompt: |
            Audit one or more specification documents against the code, and correct
            only what has become false.

            ## Which documents

            If REQUESTED is set, audit exactly those. Otherwise run
            `git diff --name-only $PUSH_RANGE` and use the "If you change… /
            Update…" table in CLAUDE.md to map the touched files onto the documents
            that follow them.
            Audit at most three; if the mapping names more, take the three whose
            subsystem the diff touched most.

            ## What to do with them

            Read each document **in full**. It is the whole point of this job: a
            claim usually goes stale across several merges, none of which
            contradicted it on its own, so reading only the diff finds nothing.

            For every claim that asserts something checkable — a number, a name, a
            route, a column, an "only", a "never", a behaviour — verify it against
            the code. Read the source. Do not reason from the document.

            ## The three rules

            1. **Correct what is false. Never touch what is merely worded oddly.**
               An audit that improves prose eventually rewrites something true, and
               then nobody can review it. If a sentence is accurate, leave it exactly
               as it is, however you would have phrased it.
            2. **Every correction cites the code that proves it**, as `file:line`, in
               the pull request body. A claim you cannot prove either way is reported
               in the body under "Could not verify" and left untouched in the file.
            3. **Follow the repository's own rules**, which are in CLAUDE.md: English
               throughout, the prose register of `check:prose`, and — if you rewrite a
               decision in `specs/08-decisions/` — the `Swept:` line its own check
               will demand of you.

            ## Finishing

            Run `pnpm verify`. It must pass before you open anything.

            If nothing was false, **open no pull request**. Say so in one line and
            stop; a pull request opened to prove the job ran is how the job gets
            muted.

            Otherwise commit on a branch named `spec-sync/<document>`, with the
            subject `docs(specs): what the code now says about <subject>`, and open a
            pull request with `gh pr create --label spec-sync`. Fill the repository's
            template. In "What changes", one bullet per correction: the claim as it
            stood, what the code does, and the `file:line` that shows it.

            You are auditing, not designing. If a document describes something you
            think is wrong in the code, that is not your business here: say it in the
            pull request body and change nothing.

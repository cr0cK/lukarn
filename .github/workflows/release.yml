# Publishes an image and a GitHub release when a `v*` tag is pushed.
#
# The tag is the trigger and the single source of the version: nothing here reads
# package.json, so a release cannot claim a version the tag does not carry.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release
  packages: write # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest

    # The browser suite runs its storage table against every backend it can reach,
    # and a release is the last place a silently shortened run may pass for a full
    # one: without this, a runner whose Docker daemon was unavailable would gate
    # the image on the folder row alone (D260816k).
    env:
      LUKARN_REQUIRE_STORAGES: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes are written by hand in CHANGELOG.md, but the full
          # history is what lets `gh release` link a comparison against the
          # previous tag.
          fetch-depth: 0

      # The gate runs again here rather than trusting the run on main. A tag can
      # be pushed on any commit, including one that never went through a pull
      # request.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

      # **Before the image is pushed, deliberately.** The notes are the one thing
      # this job cannot recover from getting wrong: a tag whose version has no
      # section used to fail *after* `build-push-action` had already published
      # the image and moved `latest`, leaving a floating tag pointing at a
      # version nothing announced — and rerunning the job does not take it back.
      # Reading the changelog costs a second and needs no registry.
      #
      # The section matching this tag becomes the release body, so the notes are
      # written once, reviewed in a pull request, and not rewritten in a web form
      # afterwards. `check:changelog` is what keeps that section fed.
      - name: Extract the changelog section
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[?" version "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md carries no section for ${GITHUB_REF_NAME}."
            echo "::error::Rename \"## [Unreleased]\" to \"## [${GITHUB_REF_NAME#v}] — <date>\" and retag."
            exit 1
          fi

          {
            echo
            echo '---'
            echo
            echo "Image: \`ghcr.io/cr0ck/lukarn:${GITHUB_REF_NAME#v}\` (linux/amd64)."
            echo "Upgrading an instance: see [deploy/README.md](https://github.com/cr0cK/lukarn/blob/main/deploy/README.md)."
          } >> notes.md

      # **Before the image is pushed as well, and for the same reason.** Every
      # gate that can refuse a release has to refuse it while there is still
      # nothing to take back: once `latest` has moved, rerunning this job does
      # not unmove it.
      #
      # It runs after the changelog extraction because that one costs a second
      # and this one costs minutes — the cheapest refusal goes first.
      #
      # The suite is what `pnpm verify` deliberately leaves out: it loads the
      # built front end in two browsers, which is the only check here that opens
      # the page a visitor will open.
      # `test:e2e` builds `dist/` before it drives it (D260817c), so the artefact
      # the browsers load is this tag's, never whatever was lying around.
      - run: pnpm --filter @lukarn/e2e exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by Actions: no secret to create, and it cannot push
          # anywhere outside this repository's namespace.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Only linux/amd64. Building arm64 here means QEMU emulation, and sharp,
      # argon2 and better-sqlite3 compile from source under it — around an hour
      # per release for an architecture nobody has asked for yet. An arm64 host
      # is not left out: the compose override builds locally, which is what the
      # deploy README points such a host at.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # `latest` moves, the version does not. An instance that pins the
          # version is never surprised by a `docker compose pull`.
          tags: |
            ghcr.io/cr0ck/lukarn:${{ steps.version.outputs.value }}
            ghcr.io/cr0ck/lukarn:latest
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

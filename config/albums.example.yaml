# Bootstrapping a fresh install.
#
# Accounts, albums and settings live in the database and are administered from
# /admin. This file only ever populates an empty database, once: as soon as one
# account exists it is never read again, and editing it does nothing.
#
# Copy it to config/albums.yaml (not tracked by git), or ignore it entirely and
# create the first administrator with:
#
#     pnpm create-admin <username>

users:
  # Generate each hash with: pnpm hash-password
  - username: alice
    passwordHash: '$argon2id$v=19$m=65536,t=3,p=4$REPLACE_ME$REPLACE_ME'
    # An administrator can connect the Drive, sync, and clear the cache.
    admin: true
    # "*" grants access to every album declared below.
    albums: ['*']

  # Restricted account: sees only the albums listed.
  - username: family
    passwordHash: '$argon2id$v=19$m=65536,t=3,p=4$REPLACE_ME$REPLACE_ME'
    albums: ['holidays-2025']

albums:
  # `folderId` is the segment after /folders/ in the Drive folder's URL:
  # https://drive.google.com/drive/folders/1AbCdEfGhIjKlMnOpQrStUvWxYz
  #                                        ^--------- this ----------^
  #
  # It is not a path: `/Holidays/photos/2026-07-Germany` will not work. The Drive
  # API only knows identifiers — open the folder you want and copy the segment
  # from its URL. That identifier survives renaming or moving the folder later.
  - id: holidays-2025
    title: 'Holidays 2025'
    description: 'Corsica, July and August'
    folderId: '1AbCdEfGhIjKlMnOpQrStUvWxYz'
    # Walk into subfolders. Set to false to index the folder's root only.
    recursive: true
    # How the grid is split on opening: "month" (default) or "day".
    # "day" suits a single trip, and it is the only split where day notes and
    # places derived from the photos are displayed.
    groupBy: day
    # Reading direction on opening: "asc" (default) starts from the oldest,
    # "desc" from the newest. A trip is told in the order it was lived; a library
    # fed as things happen is read from the end. A visitor can always flip it
    # back, and their browser remembers.
    sortOrder: asc

  - id: family
    title: 'Family photos'
    folderId: '1ZyXwVuTsRqPoNmLkJiHgFeDcBa'
    recursive: true

sync:
  # Automatic resync interval, in minutes. 0 disables it (syncing stays available
  # from /admin).
  intervalMinutes: 30
  # Sync every album when the server starts.
  onStartup: true

cache:
  # Maximum disk space for generated thumbnails. Past it, the least recently
  # viewed are removed and regenerated on demand.
  maxSizeGB: 20
